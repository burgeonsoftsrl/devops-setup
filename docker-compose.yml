name: devops-setup

x-kafka-client: &kafka-client
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092

# Traces -> Tempo, logs -> Loki (both OTLP/HTTP). Metrics are scraped by Prometheus.
x-otel: &otel
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
  OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://loki:3100/otlp/v1/logs
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:8.0
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Single-node Kafka in KRaft mode (no ZooKeeper).
  #   containers -> kafka:29092     host (./mvnw spring-boot:run, CLI tools) -> localhost:9092
  kafka:
    image: apache/kafka:4.3.2
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 2
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  user-service:
    image: devops-setup/user-service
    build:
      context: .
      dockerfile: user-service/Dockerfile
    environment:
      <<: [*otel]
      OTEL_SERVICE_NAME: user-service
      DB_URL: jdbc:postgresql://postgres:5432/app
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    ports:
      - "8081:8081"
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    image: devops-setup/order-service
    build:
      context: .
      dockerfile: order-service/Dockerfile
    environment:
      <<: [*otel, *kafka-client]
      OTEL_SERVICE_NAME: order-service
      MONGODB_URI: mongodb://mongo:27017/orders
    ports:
      - "8082:8082"
    mem_limit: 512m
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy

  payment-service:
    image: devops-setup/payment-service
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    environment:
      <<: [*otel, *kafka-client]
      OTEL_SERVICE_NAME: payment-service
      DB_URL: jdbc:postgresql://postgres:5432/app
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    ports:
      - "8083:8083"
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification-service:
    image: devops-setup/notification-service
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    environment:
      <<: [*otel, *kafka-client]
      OTEL_SERVICE_NAME: notification-service
      MONGODB_URI: mongodb://mongo:27017/notifications
    ports:
      - "8084:8084"
    mem_limit: 512m
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy

  api-gateway:
    image: devops-setup/api-gateway
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      <<: [*otel]
      OTEL_SERVICE_NAME: api-gateway
      USER_SERVICE_URL: http://user-service:8081
      ORDER_SERVICE_URL: http://order-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      CORS_ALLOWED_ORIGINS: http://localhost:4200
    ports:
      - "8080:8080"
    mem_limit: 512m
    depends_on:
      - user-service
      - order-service
      - payment-service
      - notification-service

  # ---------- observability (local) ----------
  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.6.22
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:2.10.10
    command: -config.file=/etc/tempo/tempo.yml
    user: "0"   # local only: lets Tempo write its WAL/blocks without a volume-permission dance
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
    ports:
      - "3200:3200"
      - "4318:4318"

  grafana:
    image: grafana/grafana:13.2.6
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/api-gateway.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  pgdata:
  mongodata:
  kafkadata:
