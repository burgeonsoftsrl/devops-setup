name: devops-setup

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d users"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  user-service:
    image: devops-setup/user-service
    build:
      context: .
      dockerfile: user-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/users
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    ports:
      - "8081:8081"
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    image: devops-setup/order-service
    build:
      context: .
      dockerfile: order-service/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "8082:8082"
    mem_limit: 512m
    depends_on:
      redis:
        condition: service_healthy

  api-gateway:
    image: devops-setup/api-gateway
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      USER_SERVICE_URL: http://user-service:8081
      ORDER_SERVICE_URL: http://order-service:8082
      CORS_ALLOWED_ORIGINS: http://localhost:4200
    ports:
      - "8080:8080"
    mem_limit: 512m
    depends_on:
      - user-service
      - order-service

volumes:
  pgdata:
