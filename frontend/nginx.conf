# Serves the production build in docker-compose (prod uses Cloudflare Pages instead).
server {
    listen 4200;
    server_name _;
    root /usr/share/nginx/html;

    # SPA fallback, same as public/_redirects on Cloudflare Pages
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed bundles can be cached forever; index.html must always be revalidated
    location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
