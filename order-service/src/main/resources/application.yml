server:
  port: ${PORT:8082}

spring:
  application:
    name: order-service
  data:
    redis:
      # Local default: docker-compose Redis. Prod (Upstash, TLS), e.g.:
      #   REDIS_URL=rediss://default:<password>@<name>.upstash.io:6379
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info
