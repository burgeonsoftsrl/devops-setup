name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build & test
        run: ./mvnw -B verify

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    name: Docker images + end-to-end (compose + Kafka)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images & start stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test (user -> order -> Kafka -> payment -> notifications)
        run: scripts/smoke-test.sh http://localhost:8080 180
      - name: Logs on failure
        if: failure()
        run: docker compose ps && docker compose logs --tail=150
      - name: Tear down
        if: always()
        run: docker compose down -v
