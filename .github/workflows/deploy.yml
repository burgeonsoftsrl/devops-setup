name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Push ${{ matrix.service }} to GHCR & deploy on Render
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            hook_secret: RENDER_DEPLOY_HOOK_API_GATEWAY
          - service: user-service
            hook_secret: RENDER_DEPLOY_HOOK_USER_SERVICE
          - service: order-service
            hook_secret: RENDER_DEPLOY_HOOK_ORDER_SERVICE
          - service: payment-service
            hook_secret: RENDER_DEPLOY_HOOK_PAYMENT_SERVICE
          - service: notification-service
            hook_secret: RENDER_DEPLOY_HOOK_NOTIFICATION_SERVICE
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: img
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/devops-setup-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Trigger Render deploy
        env:
          HOOK_URL: ${{ secrets[matrix.hook_secret] }}
          IMAGE: ${{ steps.img.outputs.name }}:${{ github.sha }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::warning::Secret ${{ matrix.hook_secret }} is not set; skipping Render deploy."
            exit 0
          fi
          # Deploy exactly the image we just pushed (imgURL must be URL-encoded).
          img=$(jq -rn --arg v "$IMAGE" '$v|@uri')
          sep='?'; case "$HOOK_URL" in *\?*) sep='&';; esac
          curl -fsS -X POST "${HOOK_URL}${sep}imgURL=${img}" -o /dev/null -w "Render responded %{http_code}\n"

  frontend:
    name: Deploy frontend to Cloudflare Pages
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build (gateway URL from repo variable API_URL)
        env:
          API_URL: ${{ vars.API_URL }}
        run: npm run build:pages
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy dist/frontend/browser --project-name=devops-setup --branch=main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
