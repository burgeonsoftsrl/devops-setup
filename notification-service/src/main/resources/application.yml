server:
  port: ${PORT:8084}

spring:
  application:
    name: notification-service
  data:
    mongodb:
      # Same MongoDB cluster as order-service (Atlas in prod), separate database.
      uri: ${MONGODB_URI:mongodb://localhost:27017/notifications}
      auto-index-creation: true
  kafka:
    # Local default: docker-compose Kafka. Prod: managed SASL_SSL cluster; set KAFKA_USERNAME,
    # KAFKA_PASSWORD, optionally KAFKA_SASL_MECHANISM and KAFKA_CA_CERT (see common module).
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # fail fast instead of blocking HTTP requests for 60s when Kafka is unreachable
        max.block.ms: 10000
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: io.devopssetup.common.events

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
